let activeCallUids=new Set(),callRenderVersion=0;

async function renderCall(){

 const roomId=call.id, version=++callRenderVersion;

const pendingIce=new Map();

async function stopScreenShare(){const previous=screenStream;screenStream=null;$('shareScreen').textContent='Share screen';$('shareScreen').classList.remove('active');for(const [uid,sender] of screenSenders){try{await sender.replaceTrack(getPlaceholderTrack());notifyShareState(uid)}catch(e){callStatus('Could not stop sharing: '+e.message)}}if(previous)previous.getTracks().forEach(t=>t.stop());$('screen_self')?.remove()}

async function receiveSignal(m){if(!call||m.to!==me.uid||m.from===me.uid)return;const uid=m.from;
 if(m.type==='offer'){await connectPeer(uid);const pc=callPeers.get(uid);await pc.setRemoteDescription(new RTCSessionDescription(m.data));const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await signal(uid,'answer',{type:answer.type,sdp:answer.sdp});for(const c of pendingIce.get(uid)||[])await pc.addIceCandidate(c);pendingIce.delete(uid)}

async function enterCall(roomId){if(call)await leaveCall();if(!me)throw Error('Sign in first');const roomRef=doc(db,'voiceRooms',roomId);const roomSnap=await getDoc(roomRef);if(!roomSnap.exists()||!roomSnap.data().members.includes(me.uid))throw Error('You are not invited to this call.');

 call={id:roomId,members:roomSnap.data().members};localStorage.setItem(recentRoomKey(me.uid),roomId);updateRejoinButton();$('shareScreen').disabled=false;$('shareScreen').textContent='Share screen';$('shareScreen').classList.remove('active');screenVisibility.clear();screenChannels.clear();screenSenders.clear();activeCallUids=new Set([me.uid]);muted=false;deafened=false;seenSignals.clear();pendingIce.clear();$('muteCall').textContent='Mute';$('deafenCall').textContent='Deafen';$('callPanel').hidden=false;$('screenShares').replaceChildren();$('callTitle').textContent=call.members.length>2?'Group voice call':'Private voice call';

async function leaveCall(){const previous=call;call=null;await stopScreenShare();callRenderVersion++;activeCallUids.clear();clearCallListeners();for(const uid of [...callPeers.keys()])cleanPeer(uid);if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null} $('remoteAudio').replaceChildren();$('callPanel').hidden=true;updateRejoinButton();seenSignals.clear();pendingIce.clear();screenChannels.clear();screenSenders.clear();screenVisibility.clear();if(placeholderStream){placeholderStream.getTracks().forEach(t=>t.stop());placeholderStream=null;placeholderCanvas=null}if(previous&&me){try{await deleteDoc(doc(db,'voiceRooms',previous.id,'presence',me.uid))}catch(e){say('Could not update call presence: '+e.message)}}}
async function createCall(members){if(!me)return say('Sign in first.');if(!navigator.mediaDevices?.getUserMedia)return say('Calls require HTTPS and microphone access.');const users=[...new Set([me.uid,...members])];if(users.length>4)return say('Maximum 4 people per call.');try{const ref=doc(collection(db,'voiceRooms'));await setDoc(ref,{host:me.uid,members:users,createdAt:Date.now()});await enterCall(ref.id);for(const uid of users)if(uid!==me.uid)await setDoc(doc(db,'voiceInvites',uid,'incoming',ref.id),{roomId:ref.id,from:me.uid,fromName:knownNames[me.uid]||me.displayName||'Player',createdAt:Date.now()});}catch(err){say('Could not start call: '+err.message)}}
async function inviteToCall(){if(!call)return;const handle=$('callInvite').value.trim().replace(/^@/,'').toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(handle))return callStatus('Enter a valid @username.');if(call.members.length>=4)return callStatus('Call is full (4 members).');try{let uid=(await getDoc(doc(db,'usernames',handle))).data()?.uid;if(!uid){const q=await getDocs(query(collection(db,'profiles'),where('username','==',handle),limit(10)));uid=q.docs[0]?.id}if(!uid)return callStatus('Player not found.');if(call.members.includes(uid))return callStatus('Already invited.');await updateDoc(doc(db,'voiceRooms',call.id),{members:arrayUnion(uid)});await setDoc(doc(db,'voiceInvites',uid,'incoming',call.id),{roomId:call.id,from:me.uid,fromName:knownNames[me.uid]||'Player',createdAt:Date.now()});$('callInvite').value='';callStatus('Invitation sent.')}catch(err){callStatus('Invite failed: '+err.message)}}
$('startPrivate').onclick=()=>peer?createCall([peer.uid]):say('Select a player or conversation first.');
$('startGroup').onclick=()=>createCall(peer?[peer.uid]:[]);
$('inviteCall').onclick=inviteToCall;
$('leaveCall').onclick=leaveCall;
$('muteCall').onclick=()=>{if(!localStream)return;muted=!muted;localStream.getAudioTracks().forEach(t=>t.enabled=!muted);$('muteCall').textContent=muted?'Unmute':'Mute'};
$('shareScreen').onclick=toggleScreenShare;
$('deafenCall').onclick=()=>{deafened=!deafened;document.querySelectorAll('#remoteAudio audio').forEach(a=>a.muted=deafened);$('deafenCall').textContent=deafened?'Undeafen':'Deafen'};
$('acceptCall').onclick=async()=>{if(!incoming)return;const invite=incoming;incoming=null;$('incoming').hidden=true;try{await enterCall(invite.roomId);await deleteDoc(doc(db,'voiceInvites',me.uid,'incoming',invite.roomId))}catch(e){say('Could not join call: '+e.message)}};
$('declineCall').onclick=async()=>{if(!incoming)return;const roomId=incoming.roomId;incoming=null;$('incoming').hidden=true;try{await deleteDoc(doc(db,'voiceInvites',me.uid,'incoming',roomId))}catch{}};
function watchInvites(){inviteUnsub();if(!me)return;inviteUnsub=onSnapshot(collection(db,'voiceInvites',me.uid,'incoming'),snap=>{const latest=snap.docs.sort((a,b)=>(b.data().createdAt||0)-(a.data().createdAt||0))[0];if(!latest){incoming=null;$('incoming').hidden=true;return}incoming=latest.data();$('incomingText').textContent=(incoming.fromName||'Someone')+' is calling you';$('incoming').hidden=false},e=>say('Call invitations: '+e.message))}

$('searchForm').onsubmit=async e=>{e.preventDefault();if(!me)return say('Sign in first.');const name=$('searchName').value.trim().replace(/^@+/, '').toLowerCase();if(!/^[a-z0-9_]{3,24}$/.test(name)){ $('searchResults').textContent='Use 3–24 letters, numbers or underscores, with no spaces.';return;} $('searchResults').textContent='Searching...';try{const claim=await getDoc(doc(db,'usernames',name));$('searchResults').replaceChildren();let uid=claim.exists()?claim.data().uid:null;
if(!uid){const matches=await getDocs(query(collection(db,'profiles'),where('username','==',name),limit(10)));const found=matches.docs.find(d=>d.id!==me.uid);uid=found?.id||null}
if(!uid||uid===me.uid){$('searchResults').textContent='No matching player found. If this is an older account, save its @username in the profile first.';return}
const d=await getDoc(doc(db,'profiles',uid));$('searchResults').append(playerRow(uid,d.data()||{name}))}catch(err){$('searchResults').textContent='Search failed: '+err.message}};
$('compose').onsubmit=async e=>{e.preventDefault();if(!me||!peer)return;const value=$('messageText').value.trim();if(!value)return;$('messageText').value='';try{const batch=writeBatch(db),msg=doc(collection(db,'chats',chatId,'messages'));batch.set(doc(db,'chats',chatId),{members:[me.uid,peer.uid].sort()},{merge:true});batch.set(msg,{sender:me.uid,text:value,createdAt:serverTimestamp()});batch.set(doc(db,'inboxes',me.uid,'threads',chatId),{peerId:peer.uid,peerName:peer.name,unread:0,updatedAt:Date.now()},{merge:true});batch.set(doc(db,'inboxes',peer.uid,'threads',chatId),{peerId:me.uid,peerName:knownNames[me.uid]||me.displayName||'Someone',unread:increment(1),updatedAt:Date.now()},{merge:true});await batch.commit();say('')}catch(err){$('messageText').value=value;say('Message failed: '+err.message)}};
onAuthStateChanged(auth,async u=>{await leaveCall();inviteUnsub();stopInbox();stopChat();me=u;updateRejoinButton();watchInvites();peer=null;chatId=null;$('feed').replaceChildren();$('messageText').disabled=true;$('send').disabled=true;if(!u){$('who').textContent='Not signed in';$('directory').textContent='Sign in to see players.';say('Please sign in on the homepage first.');return}try{const p=await getDoc(doc(db,'profiles',u.uid));knownNames[u.uid]=p.data()?.name||u.displayName||'Someone'}catch{}$('who').textContent='Signed in';loadDirectory(true);stopInbox=onSnapshot(collection(db,'inboxes',u.uid,'threads'),snap=>{const box=$('threads');box.replaceChildren();const threads=snap.docs.sort((a,b)=>(b.data().updatedAt||0)-(a.data().updatedAt||0));threads.forEach(d=>{const v=d.data();getDoc(doc(db,'profiles',v.peerId)).then(p=>{if(box.isConnected)box.append(playerRow(v.peerId,p.data()||{name:v.peerName},v.unread))}).catch(()=>{box.append(playerRow(v.peerId,{name:v.peerName},v.unread))})})},err=>say('Conversations unavailable: '+err.message))});
</script></body></html>

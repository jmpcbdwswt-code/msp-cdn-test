<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Simpsons: Hit & Run</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:14px system-ui}#status{position:fixed;z-index:99999;top:0;left:0;right:0;padding:10px;background:#151515e8;color:#b9f7bd;white-space:pre-wrap;max-height:31vh;overflow:auto;font:12px monospace}#game{width:100vw;height:100vh;min-height:100vh;overflow:hidden}#loading{position:fixed;top:45%;width:100%;text-align:center}.loading-track{height:6px;background:#333;margin:10px 20%}.loading-track i{display:block;height:100%;width:0;background:yellow}#hud[hidden],#menu[hidden],#loading[hidden]{display:none}

#status{display:none}#status.visible{display:block;max-height:30vh}
#game canvas{outline:none}
#pause.touch-pause{display:none!important}
#v6toolbar{position:fixed;top:12px;right:12px;z-index:99998;display:flex;gap:6px;opacity:.72;transition:opacity .2s}
#v6toolbar:hover,#v6toolbar:focus-within{opacity:1}
#v6toolbar button{border:1px solid #777;background:#111c;color:white;border-radius:6px;padding:7px 11px;font:12px system-ui;cursor:pointer}
#v6toolbar button:hover{background:#333}

/* Ensure menu buttons can receive pointer input without blocking driving. */
#menu:not([hidden]){pointer-events:auto!important}
#menu:not([hidden]) .original-stage,
#menu:not([hidden]) .original-actions,
#menu:not([hidden]) .original-button,
#menu:not([hidden]) .original-back,
#menu:not([hidden]) .original-arrow{pointer-events:auto!important}
#menu:not([hidden]) .original-actions{z-index:20}
#menu:not([hidden]) .original-button,
#menu:not([hidden]) .original-back,
#menu:not([hidden]) .original-arrow{position:relative;cursor:pointer;touch-action:manipulation}
#menu:not([hidden]) .original-board,
#menu:not([hidden]) .original-tv,
#menu:not([hidden]) .original-logo{pointer-events:none!important}

</style></head><body>
<pre id="status">Loading game...</pre>
<div id="v6toolbar"><button type="button" id="v6full">FULLSCREEN</button></div>
<main id="game" aria-label="Hit and Run driving game"></main>
<div id="loading" role="status"><img id="game-logo" alt="The Simpsons Hit and Run" style="max-width:45vw"><div class="loading-track"><i id="load-progress"></i></div><p id="load-message">Loading...</p></div>
<div id="hud" hidden><div class="state-bridge" hidden aria-hidden="true"><span id="district"></span><span id="place-name"></span><span id="mode-badge">FREE DRIVE</span><span id="coin-count">0 / 0</span><div id="challenge-hud"><span id="objective"></span><span id="checkpoint"></span><span id="timer"></span><i id="challenge-progress"></i></div><div id="toast"></div><canvas id="minimap" width="360" height="360"></canvas><span id="map-caption"></span><div id="drive-hints"></div><span id="car-label"></span><span id="gear">N</span><span id="speed">0</span><i id="speed-progress"></i><span id="condition">100%</span><i id="condition-progress"></i></div><button id="pause" aria-label="Pause game">START</button><div id="touch-controls"><div><button data-key="KeyA">←</button><button data-key="KeyD">→</button></div><div><button data-key="KeyE">E</button><button data-key="Space">SPACE</button><button data-key="KeyS">S</button><button data-key="KeyW">W</button></div></div></div>
<section id="menu" hidden aria-label="Game menu"><div class="state-bridge" hidden aria-hidden="true"><button id="play"><span>Continue</span></button><button id="challenge">Springfield Run</button><span id="menu-place"></span><span id="scene-info"></span></div><div class="settings-grid" hidden><label>LEVEL<select id="level"><option value="1">1 · Homer</option><option value="2">2 · Bart</option><option value="3">3 · Lisa</option><option value="4">4 · Marge</option><option value="5">5 · Apu</option><option value="6">6 · Bart</option><option value="7">7 · Homer</option></select></label><label>VEHICLE<select id="car"></select></label><label>LIGHTING<select id="lighting"><option value="golden">Golden hour</option><option value="day">Afternoon</option><option value="night">Blue hour</option></select></label><label>START AT<select id="location"></select></label></div><div class="menu-footer" hidden><button id="sound">SOUND OFF</button><button id="quality">HIGH QUALITY</button><button id="fullscreen">FULLSCREEN</button></div></section>
<div id="debug" hidden></div>
<script type="module">
const base='https://vheissu.github.io/hit-and-run-web/';
const status=document.getElementById('status');
const log=s=>{status.textContent+='\n'+s;status.scrollTop=status.scrollHeight;};
const originalFetch=window.fetch.bind(window);
let requests=0,failed=0;
function remoteAsset(input){
 const raw=typeof input==='string'?input:input instanceof URL?input.href:input.url;
 const url=new URL(raw,location.href);
 if(url.origin===location.origin && (url.pathname.startsWith('/assets/')||url.pathname.startsWith('/hit-and-run-web/assets/'))){
  return base+'assets/'+url.pathname.split('/assets/')[1]+url.search;
 }
 return raw;
}
// Version 12: distribute ambient walkers toward the starting neighborhood.
// Existing mission commands and their character identifiers remain untouched.
const EXTRA_PEDESTRIANS=18; // conservative Chromebook limit
let characterCatalogPromise;
async function characterCatalog(){
 if(!characterCatalogPromise)characterCatalogPromise=originalFetch(base+'assets/campaign/assets.json')
  .then(r=>{if(!r.ok)throw Error('Character catalog HTTP '+r.status);return r.json()})
  .then(j=>j.characters||{});
 return characterCatalogPromise;
}
async function populateLevel(response){
 try{
  const level=await response.clone().json();
  if(!Array.isArray(level.initial)||!level.locators)return response;
  const characters=await characterCatalog();
  const commands=level.initial;
  const ambient=commands.filter(c=>c.op==='AddAmbientCharacter');
  const used=new Set(commands.filter(c=>['AddAmbientCharacter','AddNPCCharacterBonusMission','AddPurchaseCarReward'].includes(c.op)).map(c=>String(c.args[c.op==='AddPurchaseCarReward'?1:0]).toLowerCase()));
  const missionText=JSON.stringify(level.missions||[]).toLowerCase();
  const candidates=Object.keys(characters).filter(id=>!used.has(id.toLowerCase())&&!missionText.includes('"'+id.toLowerCase()+'"'));
  const home=level.locators.simpsonshouse?.position;
  const routes=ambient.map(c=>{
   const id=String(c.args[0]);
   const points=commands.filter(w=>w.op==='AddAmbientNPCWaypoint'&&String(w.args[0])===id)
    .map(w=>w.args[1]).filter(k=>Array.isArray(level.locators[k]?.position));
   const nearest=home?Math.min(...points.map(k=>{
    const p=level.locators[k].position;return Math.hypot(p[0]-home[0],p[2]-home[2]);
   })):Infinity;
   return {id,points,nearest};
  }).filter(r=>r.points.length>=2).sort((a,b)=>a.nearest-b.nearest);
  if(!routes.length||!candidates.length)return response;
  const count=Math.min(EXTRA_PEDESTRIANS,candidates.length);
  // Prefer the closest pre-existing, proven walking paths; keep some walkers elsewhere.
  const nearCount=home?Math.ceil(count*0.65):0;
  let added=0;
  for(let i=0;i<count;i++){
   const route=i<nearCount?routes[i%Math.min(3,routes.length)]:routes[(i-nearCount)%routes.length];
   const id=candidates[i];
   const start=route.points[(i*2)%route.points.length];
   commands.push({op:'AddAmbientCharacter',args:[id,start,0],line:0});
   for(let j=0;j<route.points.length;j++){
    commands.push({op:'AddAmbientNPCWaypoint',args:[id,route.points[(j+i+1)%route.points.length]],line:0});
   }
   added++;
  }
  log('V12: Added '+added+' walkers on existing paths; nearest routes prioritized.');
  const headers=new Headers(response.headers);
  headers.delete('content-length');headers.delete('content-encoding');
  headers.set('content-type','application/json; charset=utf-8');
  return new Response(JSON.stringify(level),{status:response.status,statusText:response.statusText,headers});
 }catch(e){log('V12 pedestrian patch skipped: '+String(e));return response;}
}
window.fetch=async(input,init)=>{
 const next=remoteAsset(input),before=typeof input==='string'?input:input.url;
 if(next!==before){requests++;if(requests<=5)log('Redirect fetch: '+before+' -> '+next);}
 try{
  const response=input instanceof Request && next!==input.url?await originalFetch(new Request(next,input),init):await originalFetch(next,init);
  if(!response.ok){failed++;log('HTTP '+response.status+': '+response.url);}
  if(response.ok && /\/assets\/campaign\/level[1-7]\.json(?:\?|$)/.test(new URL(next,location.href).pathname)){
   return await populateLevel(response);
  }
  return response;
 }catch(e){failed++;log('FETCH FAILED: '+next+' | '+e);throw e;}
};
const xhrOpen=XMLHttpRequest.prototype.open;
XMLHttpRequest.prototype.open=function(method,url,...rest){const next=remoteAsset(url);if(next!==String(url))log('Redirect XHR: '+url);return xhrOpen.call(this,method,next,...rest)};
// Image loading uses image.src rather than fetch(). Redirect only matching game paths.
const imageSrc=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');
if(imageSrc?.get&&imageSrc?.set){Object.defineProperty(HTMLImageElement.prototype,'src',{configurable:true,enumerable:imageSrc.enumerable,get(){return imageSrc.get.call(this)},set(v){const next=remoteAsset(String(v));return imageSrc.set.call(this,next)}})}
// Video cutscenes use media.src, not fetch(). Redirect those URLs too.
for(const proto of [HTMLMediaElement.prototype,HTMLSourceElement.prototype]){
 const desc=Object.getOwnPropertyDescriptor(proto,'src');
 if(desc?.get&&desc?.set)Object.defineProperty(proto,'src',{
  configurable:true,enumerable:desc.enumerable,
  get(){return desc.get.call(this)},
  set(value){const next=remoteAsset(String(value));if(next!==String(value))log('Redirect video: '+value+' -> '+next);return desc.set.call(this,next)}
 });
}
const originalSetAttribute=Element.prototype.setAttribute;
Element.prototype.setAttribute=function(name,value){
 if(name.toLowerCase()==='src' && (this instanceof HTMLMediaElement || this instanceof HTMLSourceElement)){
  const next=remoteAsset(String(value));if(next!==String(value))log('Redirect media attribute: '+value+' -> '+next);
  return originalSetAttribute.call(this,name,next);
 }
 return originalSetAttribute.call(this,name,value);
};
window.addEventListener('error',e=>{if(e.target&&e.target!==window&&e.target.src){log('RESOURCE ERROR: '+e.target.src)}else log('JS ERROR: '+e.message)},true);
window.addEventListener('unhandledrejection',e=>{log('PROMISE REJECTION: '+String(e.reason));status.classList.add('visible')});
// Fullscreen remains optional and only activates when clicked.

document.getElementById('v6full').onclick=async()=>{
 try{
  if(document.fullscreenElement)await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
 }catch(e){log('Fullscreen unavailable: '+e);status.classList.add('visible')}
};
// Fix images inserted by the game's UI with root-relative paths.
function fixImages(root=document){
 for(const media of root.querySelectorAll?.('video[src],audio[src],source[src]')??[]){const old=media.getAttribute('src');if(!old)continue;const next=remoteAsset(old);if(next!==old&&media.src!==next){log('Fix media URL: '+old);media.src=next;}}
 for(const img of root.querySelectorAll?.('img[src]')??[]){
  const old=img.getAttribute('src');if(!old)continue;
  const next=remoteAsset(old);if(next!==old && img.src!==next)img.src=next;
 }
}
const watcher=new MutationObserver(()=>fixImages());
watcher.observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});

try{
 const r=await originalFetch(base);if(!r.ok)throw Error('Remote HTML HTTP '+r.status);
 const doc=new DOMParser().parseFromString(await r.text(),'text/html');
 for(const link of doc.querySelectorAll('link[rel="stylesheet"]')){const l=document.createElement('link');l.rel='stylesheet';l.href=new URL(link.getAttribute('href'),base).href;document.head.append(l)}
 document.getElementById('game-logo').src=base+'assets/ui/gamelogo.png';
 const entry=doc.querySelector('script[type="module"][src]');if(!entry)throw Error('No module entry found');
 const url=new URL(entry.getAttribute('src'),base).href;
 log('Importing: '+url);
 await import(url);
 log('Module imported. Redirected fetch count: '+requests+'. HTTP/network failures: '+failed);
 log('Game module loaded.');
}catch(e){log('STOPPED: '+String(e));status.classList.add('visible')}
</script></body></html>
